# Site settings
title: "Jeff Spaulding"
description: "IT Systems Engineer, Autism Advocate, and Overall Wizard"

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed

# Resume settings
resume_avatar:                  "true"
resume_name:                    "Jeff Spaulding"
resume_title:                   "Systems Engineer"

# used for the contact button in _layouts/resume.html
resume_contact_email:           "jeff@jeffspaulding.com"

# the next two items are used for schema itemprops in _layouts/resume.html
# resume_contact_telephone:       "555-7334"
# resume_contact_address:         "742 Evergreen Terrace, Springfield"

resume_header_contact_info:     "Los Angeles, California • jeff@jeffspaulding.com"
display_header_contact_info:    "true"

resume_header_intro: "<p>IT professional with 12 years of experience in IT systems and security and 6 years of experience as an IT lead. With a strong background in Identity and Access Management (IAM), Mobile Device Management (MDM), and Software-as-a-Service (SaaS) Administration, I have consistently delivered reliable and secure outcomes for top-tier organizations. Expertise in automation, process improvement, IT security practices, and IT asset management. Experienced in managing IT across remote organizations, spanning different time zones, countries, and continents. Excellent communication and collaboration skills, committed to creating a diverse and inclusive work environment.</p>"

# use "yes" to display the email contact button,
# "no" to display an "I'm not looking for work" message,
# or remove the resume_looking_for_work option entirely
