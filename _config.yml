resume_executive_summary: '<p>Detail-Oriented IT Engineer with 12+ years of experience transforming complex IT challenges into robust, predictable systems that prioritize efficiency and user experience. Successfully governed enterprise operations and security at <a href="#meta">Meta</a>, <a href="#appletv">Apple TV+</a>, and <a href="#scopey">Scopely</a>, achieving $450,000+ in quantified cost savings and improving client satisfaction by 60% (CSAT) through systematic problem-solving. Unique background integrates DevOps principles across AWS/GCP infrastructure, IAM automation (SCIM, SAML, OIDC), and extensive scripting (Python, PowerShell), supported by expertise in MDM, networking, and data migration. Seeking a Cloud/DevOps environment that values clear, documented processes and fosters an inclusive culture focused on long-term systemic health.</p>'

# use "yes" to display the email contact button,
