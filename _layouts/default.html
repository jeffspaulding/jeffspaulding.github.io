<!DOCTYPE html>
<html>

  {% include head.html %}

  <body class="theme-{% if site.resume_theme %}{{ site.resume_theme }}{% endif %}">

    <div class="wrapper" itemscope itemtype="http://schema.org/Person">

      {% include nav.html %}

      <header class="page-header">

        <!-- You can turn off the avatar in _config.yml by setting to false -->
        {% if site.resume_avatar == 'true' %}
        <img src="images/avatar.jpg" alt="my photo" class="avatar no-print" itemprop="image">
        {% endif %}

        <!-- Your name is defined in the _config.yml file -->
        <span class="header-name" itemprop="name">{{ site.resume_name }}</span>

        <!-- To display contact info here, change `display_header_contact_info` value in _config.yml to true -->
        {% if site.display_header_contact_info == 'true' %}
        <span class="header-contact-info">{{ site.resume_header_contact_info }}</span>
        {% endif %}
      </header>

      {{ content }}

      <footer class="page-footer">
        <p class="footer-line">Forked from <a href="http://twitter.com/jglovier">@jglovier</a>'s Jekyll resume template on <a href="https://github.com/jglovier/resume-template">GitHub</a>.</p>
      </footer>
    </div>

  </body>

</html>
